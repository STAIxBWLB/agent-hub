# agent-hub routing: who takes which kind of task (L1), and which model route the local worker asks for (L2).
# [targets.*] and [routes.*] use Switchyard's own table shapes (v0.2.0 toml_schema): the hub copies them into the
# sidecar config and adds the gateway client, so anything Switchyard accepts can be written here.

[local]
route = "sy/coding"                                        # Switchyard route the local worker asks for
fixed_model = "vllm/deepseek-ai/DeepSeek-V4-Flash-0731"    # straight to OmniRoute when the sidecar is absent or unhealthy

[targets.dsv4f]
id = "vllm/deepseek-ai/DeepSeek-V4-Flash-0731"

[routes."sy/coding"]
type = "passthrough"
target = "dsv4f"

[routes."sy/fast"]
type = "passthrough"
target = "dsv4f"

# When the DGX serves GLM-5.3-Flash, replace sy/coding with the two-tier route and add the review escalation:
#
# [targets.glm53f]
# id = "vllm/zai-org/GLM-5.3-Flash"
#
# [routes."sy/coding"]
# type = "stage_router"
# efficient_target = "glm53f"
# capable_target = "dsv4f"
# picker = "efficient_first"
# confidence_threshold = 0.5
#
# [routes."sy/review"]
# type = "llm_classifier"
# mode = "escalation"
# classifier_target = "glm53f"
# weak_target = "glm53f"
# strong_target = "dsv4f"
#
# [routes."sy/review".escalation]      # required by the 0.2.0 binary for mode = "escalation"
# confirmations = 2

# L1: task assignment. `peers` is the preference order among attached, unpaused peers (idle before busy).
# `route` / `fixed_model` apply when the task lands on the local worker. Two changes_requested in a row move the
# task to the next attached peer in `escalate_to`.

[signals]
pii_patterns = ["\\b\\d{6}-\\d{7}\\b", "@example\\.ac\\.kr"]   # resident registration numbers, campus mail addresses
long_context_tokens = 120000

[constraints]
pii = "local_only"            # hard: a PII task is owned by `local` or nobody, and nothing about it leaves the hub
long_context = "skip_local"
budget_paused = "skip_peer"

[classes.plan]
peers = ["claude", "codex"]
local_allowed = false

[classes.implement]
peers = ["codex", "kimi", "local"]
route = "sy/coding"
escalate_to = ["kimi", "claude"]

[classes.bulk_edit]
peers = ["local", "kimi"]
route = "sy/fast"
escalate_to = ["kimi", "codex"]

[classes.test]
peers = ["kimi", "local", "codex"]
route = "sy/fast"
escalate_to = ["codex"]

[classes.review]
peers = ["claude", "codex"]
local_allowed = false         # judgment classes never go to local

[classes.summarize]
peers = ["local", "kimi"]
route = "sy/fast"

[classes.triage]
peers = ["local", "kimi"]
route = "sy/fast"
