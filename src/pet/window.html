<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>agent-hub pet</title>
<style>
:root { color-scheme: dark; font: 12px system-ui, sans-serif; color: #eceef3; }
html, body { margin: 0; background: transparent; overflow: hidden; }
body { width: 150px; height: 150px; display: flex; align-items: center; flex-direction: column; justify-content: flex-end; gap: 4px; padding-bottom: 4px; box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: transparent; border-radius: 10px; }
button:focus-visible, input:focus-visible { outline: 2px solid #79dfb2; outline-offset: 2px; }
#pet { width: 63px; height: 58px; padding: 0; cursor: grab; touch-action: none; }
#pet:active { cursor: grabbing; }
svg { width: 100%; height: 100%; overflow: visible; image-rendering: pixelated; filter: drop-shadow(0 1px 1px #687a78) drop-shadow(0 0 1px #687a78); }
[data-palette="blue"] svg { filter: drop-shadow(0 1px 1px #64748b) drop-shadow(0 0 1px #64748b); }
[data-palette="violet"] svg { filter: drop-shadow(0 1px 1px #796d8b) drop-shadow(0 0 1px #796d8b); }
[data-palette="ochre"] svg { filter: drop-shadow(0 1px 1px #81725f) drop-shadow(0 0 1px #81725f); }
rect { fill: #168b87; }
[data-palette="blue"] rect { fill: #3979d6; }
[data-palette="violet"] rect { fill: #8864cc; }
[data-palette="ochre"] rect { fill: #be7a22; }
[data-state="waiting"] rect { fill: #c4880f; }
[data-state="blocked"] rect { fill: #cf6156; }
[data-state="review"] rect { fill: #8a6cd8; }
[data-state="offline"] rect { fill: #6f7787; }
body[data-state="working"] #frame { animation: working-bob 0.7s steps(3, end) infinite; }
@keyframes working-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@media (prefers-reduced-motion: reduce) {
  body[data-state="working"] #frame { animation: none; }
}
#pill { display: flex; align-items: center; gap: 4px; border-radius: 14px; padding: 3px 7px; background: #242936ed; font-size: 11px; }
#pill button { padding: 2px 4px; }
#composer { width: 100%; background: #242936f5; padding: 4px; border-radius: 10px; box-sizing: border-box; }
#composer[hidden] { display: none; }
/* Hidden by opacity only: visibility would drop the #state live region from the a11y tree. */
#pill { opacity: 0; pointer-events: none; transition: opacity .12s ease; }
#pet:hover ~ #pill, #pet:focus-visible ~ #pill, #pill:hover, #pill:focus-within, body[data-hover] #pill, body[data-composing] #pill { opacity: 1; pointer-events: auto; }
input { width: 100%; box-sizing: border-box; border: 1px solid #657081; border-radius: 6px; padding: 5px; background: #111722; color: #eceef3; font: 13px system-ui; }
#result { margin-top: 2px; min-height: 12px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<button id="pet" aria-label="Open agent-hub dashboard"><svg id="frame" role="img" aria-label="Pet" viewBox="0 0 60 64"></svg></button>
<div id="pill"><span id="state" aria-live="polite">Starting</span><button id="pencil" aria-label="Write a console message">✎</button><button id="close" aria-label="Close pet window">×</button></div>
<div id="composer" hidden><input id="message" aria-label="Console message" placeholder="Message, Enter to send" maxlength="65536"><div id="result" role="status">Esc to cancel</div></div>
<script>
const post = body => window.webkit.messageHandlers.pet.postMessage(body);
const pet = document.getElementById('pet'), frame = document.getElementById('frame'), pill = document.getElementById('pill');
const state = document.getElementById('state'), composer = document.getElementById('composer'), input = document.getElementById('message'), result = document.getElementById('result');
let signature = '', drag, sending = false;
const draw = (x, y, w, h) => {
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y); rect.setAttribute('width', w); rect.setAttribute('height', h);
  return rect;
};
window.update = view => {
  if (view.offline) {
    document.body.dataset.state = 'offline'; state.textContent = 'Offline';
    document.getElementById('pencil').disabled = true; return;
  }
  document.getElementById('pencil').disabled = false;
  document.body.dataset.state = view.state;
  document.body.dataset.palette = view.palette;
  state.textContent = view.state + (view.act ? ' · act ' + view.act : '') + (view.watch ? ' · watch ' + view.watch : '');
  pet.setAttribute('aria-label', 'Open dashboard, ' + state.textContent);
  const next = JSON.stringify(view.frame);
  if (signature === next) return;
  signature = next;
  frame.setAttribute('viewBox', '0 0 ' + view.frame.width + ' ' + view.frame.height);
  frame.replaceChildren(...view.frame.pixels.map(([x, y]) => draw(x, y, 1, 1)));
};
window.focusInput = () => { document.body.dataset.composing = ''; composer.hidden = false; input.focus(); };
window.commandResult = ok => { sending = false; input.disabled = false; result.textContent = ok ? 'Sent' : 'Not confirmed; check the dashboard.'; if (ok) { input.value = ''; composer.hidden = true; delete document.body.dataset.composing; } };
document.getElementById('pencil').addEventListener('click', () => post({ kind: 'pencil' }));
document.getElementById('close').addEventListener('click', () => post({ kind: 'close' }));
input.addEventListener('keydown', event => {
  if (event.key === 'Escape') { composer.hidden = true; delete document.body.dataset.composing; pet.focus(); }
  if (event.key === 'Enter' && !event.isComposing && input.value.trim() && !sending) {
    event.preventDefault(); sending = true; input.disabled = true; result.textContent = 'Sending'; post({ kind: 'send', text: input.value });
  }
});
// The native host polls the global mouse position against this rect (pet + pill) and
// calls hoverChanged, because an inactive accessory panel never fires CSS :hover.
window.hoverChanged = on => { if (on) document.body.dataset.hover = ''; else delete document.body.dataset.hover; };
const postHotspot = () => {
  const a = pet.getBoundingClientRect(), b = pill.getBoundingClientRect();
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  post({ kind: 'hotspot', x, y, w: Math.max(a.right, b.right) - x, h: Math.max(a.bottom, b.bottom) - y });
};
pet.addEventListener('pointerdown', event => { drag = { x: event.screenX, y: event.screenY, moved: false }; pet.setPointerCapture(event.pointerId); });
pet.addEventListener('pointermove', event => {
  if (!drag) return;
  const dx = event.screenX - drag.x, dy = event.screenY - drag.y;
  if (!dx && !dy) return;
  drag.moved = true; drag.x = event.screenX; drag.y = event.screenY;
  post({ kind: 'drag', dx, dy });
});
pet.addEventListener('pointerup', () => { const moved = drag?.moved; drag = null; if (!moved) post({ kind: 'open' }); });
pet.addEventListener('pointercancel', () => { drag = null; });
pet.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); post({ kind: 'open' }); } });
postHotspot();
post({ kind: 'ready' });
</script>
</html>
