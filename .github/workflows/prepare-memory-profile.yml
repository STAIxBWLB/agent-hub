name: Prepare memory profile draft
on:
  push:
    branches: [feat/412-p9-hub-profile]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: memory-profile-bundle
          include-hidden-files: true
          path: |
            plugins/agent-hub/server.js
            plugins/agent-hub/.claude-plugin/plugin.json
      - run: bun x tsc --noEmit
      - run: bun test --timeout 20000 test/memory-*.test.ts test/recovery-package-memory.test.ts
