name: pages

# Publishes site/ (static, no build step) to GitHub Pages at agent-hub.staix.net.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      # The CDN gives CSS/JS a 4 h browser TTL but HTML 10 min: stamp asset URLs with the commit
      # so a cached old stylesheet is never paired with new markup.
      - name: Stamp asset versions
        run: |
          grep -rl '?v=dev' site --include='*.html' | xargs sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g"
          ! grep -rq '?v=dev' site --include='*.html'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
