name: rooms presence diagnosis (temporary 742)
on:
  push:
    branches: [fix/742-rooms-presence-cost]
permissions:
  contents: read
concurrency:
  group: rooms-presence-diagnostic-742
  cancel-in-progress: false
jobs:
  macos-presence-diagnosis:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Compare source revisions and idle-entry scheduling
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="$RUNNER_TEMP/presence-742"
          mkdir -p "$diagnostic_root"
          cp scripts/diagnose-presence-cost-742.ts "$diagnostic_root/preload.ts"
          failures=0
          for source_ref in b7aec7d5 b5c25254 3185dd4c 92486ab5; do
            source_dir="$diagnostic_root/source-$source_ref"
            git worktree add --detach "$source_dir" "$source_ref"
            cp "$diagnostic_root/preload.ts" "$source_dir/scripts/diagnose-presence-cost-742.ts"
            (
              cd "$source_dir"
              bun install --frozen-lockfile
              for mode in 0 1; do
                echo "PRESENCE_DIAGNOSTIC_REF $source_ref mode=$mode"
                set +e
                AHUB_PRESENCE_DIAG_IDLE_ENTRY="$mode" bun test --preload ./scripts/diagnose-presence-cost-742.ts test/rooms-delivery.test.ts --test-name-pattern "1000 presence flips" --timeout 20000 2>&1 | tee "$diagnostic_root/$source_ref-$mode.log"
                result=${PIPESTATUS[0]}
                set -e
                echo "$result" > "$diagnostic_root/$source_ref-$mode.exit"
                echo "PRESENCE_DIAGNOSTIC_EXIT $source_ref mode=$mode exit=$result"
              done
            )
          done
          for result_file in "$diagnostic_root"/*.exit; do
            if [ "$(cat "$result_file")" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "Diagnostic only: $failures failed reference/mode cases." >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rooms-presence-diagnostic-742
          path: ${{ runner.temp }}/presence-742/*.log
