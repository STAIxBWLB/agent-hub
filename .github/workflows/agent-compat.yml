name: agent-compat

# TEMPORARY measurement branch only (#1248/#775). Restore main's workflow before PR submission.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-startup-measure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    name: python-startup (${{ matrix.runner }}, ${{ matrix.mode }}, ${{ matrix.replicate }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-latest, macos-15]
        mode: [output-check, extract]
        replicate: [1, 2, 3]
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x64
          - runner: macos-15
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      # No setup-python, setup-bun, package installation or Python probe precedes this sample.
      - name: Measure the first Python invocation, warm repeats and refusal control
        env:
          MEASURE_MODE: ${{ matrix.mode }}
          MEASURE_REPLICATE: ${{ matrix.replicate }}
          MEASURE_EXPECTED_OS: ${{ matrix.os }}
          MEASURE_EXPECTED_ARCH: ${{ matrix.arch }}
        run: node scripts/compat-receipts/python-startup-measure.mjs --mode "$MEASURE_MODE" --replicate "$MEASURE_REPLICATE" --source-sha "$GITHUB_SHA" --output measurement/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-startup-${{ matrix.runner }}-${{ matrix.mode }}-${{ matrix.replicate }}-${{ github.sha }}
          path: measurement/result.json
          if-no-files-found: error
          retention-days: 7
