name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: The tag has to match package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Gate
        run: scripts/check.sh
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "agent-hub $GITHUB_REF_NAME"
