name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: The tag has to match package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - name: Verify the successful full gate for the identical release tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse.mjs --require

  # Only this job can mint the npm publish credential (OIDC) or write the release.
  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing: no token; npm needs 11.5.1 or later and publishes provenance by itself.
      - name: npm with trusted publishing support
        run: npm install -g npm@11.20.0
      - name: Publish to npm (trusted publishing, provenance)
        run: npm publish --access public
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "agent-hub $GITHUB_REF_NAME"
