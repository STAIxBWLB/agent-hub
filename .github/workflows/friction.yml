name: friction

# #1644 T4: the friction corpus on main, nightly. It drives the built ahub entry of the checked-out commit as a subprocess in a throwaway HOME, state
# directory and git repository: offline, no model call, no account, no secret. The job reads the repository and uploads results.json; it has no write
# permission of any kind and no other credential. Report only: it is not part of check.yml, and a gate comes after two stable weeks (docs/friction.md).
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friction
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run the corpus against this commit
        run: bun scripts/benchmarks/friction/run.ts --binary src/cli/main.js --out results.json
      - name: Write the counts to the job summary
        if: always()
        run: |
          if [ -f results.json ]; then
            {
              echo '### Friction corpus'
              echo
              echo "commit ${GITHUB_SHA}"
              echo '```'
              bun -e 'const r = JSON.parse(await Bun.file("results.json").text()); console.log(`ahub ${r.binary.version} ${r.binary.digest.slice(0, 12)}, corpus v${r.corpusVersion}`); console.log(JSON.stringify(r.totals))'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: friction-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.json
          if-no-files-found: error
          retention-days: 30
