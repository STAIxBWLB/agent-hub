name: routing-receipt

# #637 parts 1 and 2: a PR that changes templates/routing.toml needs a promotion receipt under docs/verification/ that names that exact file, the current default and the
# frozen corpus, and whose numbers the check recomputes. No model runs: the check reads git and files. The rule is the "Routing promotion rule" in
# docs/agent-notes/benchmarks.md; the logic and its tests are scripts/check-routing-receipt.ts and test/routing-receipt-check.test.ts.
#
# It is also the repository's eval check (#481 S5). An Actions job's own check run has no title or summary the hub can read, so the script publishes a SECOND check
# run named `routing-eval` at the PR head (Checks API, hence `checks: write`) whose title carries `eval_pass_rate=<0..1> eval_suite=<corpus hash prefix>`, the markers
# `readEvalResult` (src/hub/eval-gate.ts) parses. The person sets `eval_check = "routing-eval"` in .agenthub/sdlc.toml. A failed publish is a warning, never a pass:
# the hub then shows the eval gate as not reported.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  checks: write

jobs:
  routing-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: A routing.toml change carries a matching receipt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check-routing-receipt.ts "$BASE_SHA" --publish
      # #637 part 2: the same for the MODEL-ROUTING keys of that file (hub_routes, local, fixed_model, stay_switch, the pi windows). It rebuilds the deterministic comparison and checks the by-hand
      # live half (served model ids) only for shape and consistency: no gateway, key or secret is ever available to this job. Rule: "Model-routing promotion rule" in docs/agent-notes/benchmarks.md.
      - name: A model-routing change carries a matching receipt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/check-model-routing-receipt.ts "$BASE_SHA"
