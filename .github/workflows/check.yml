name: check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_bundle:
        description: Build committed plugin assets for review, without publishing
        type: boolean
        default: false
      timing_runs:
        description: Sequential macOS runs of daemon, PII screen and ACP tests only (0 disables)
        type: choice
        options: ['0', '20']
        default: '0'
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  # #609: one group per PR, so PRs run side by side; within a PR a newer pending run replaces the older pending one
  # (queue single), while an admitted controller is never cancelled. Main pushes and dispatches keep queue max.
  # GitHub refuses queue max together with cancel-in-progress true, so in-progress runs are not cancelled.
  # ponytail: controllers of different groups admitting the same tree at the same instant both run it (a duplicate run,
  # never a false green); a repository-wide group removes that at the cost of serializing every PR.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.timing_runs == '20' && 'macos-timing' || github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || 'check-main' }}
  cancel-in-progress: false
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  decision:
    if: github.event_name != 'workflow_dispatch' || (!inputs.prepare_bundle && inputs.timing_runs != '20')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_gate: ${{ steps.reuse.outputs.run_gate }}
      admission: ${{ steps.reuse.outputs.admission }}
      verified_run: ${{ steps.reuse.outputs.verified_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse.mjs

  prepare-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_bundle && inputs.timing_runs != '20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-assets-${{ github.sha }}
          include-hidden-files: true
          path: |
            plugins/agent-hub/server.js
            plugins/agent-hub/.claude-plugin/plugin.json

  check:
    needs: decision
    if: needs.decision.outputs.admission == 'run' || needs.decision.outputs.admission == 'reuse'
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 40 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the seatbelt sandbox tests; Ubuntu proves the rest does not depend on macOS.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Reuse verified identical-tree full gate
        if: needs.decision.outputs.admission == 'reuse'
        env:
          VERIFIED_RUN: ${{ needs.decision.outputs.verified_run }}
        run: |
          test -n "$VERIFIED_RUN" || { echo "missing verified full-gate proof"; exit 1; }
          echo "Reused identical-tree full gate run $VERIFIED_RUN"
      - uses: actions/checkout@v7
        if: needs.decision.outputs.run_gate == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        if: needs.decision.outputs.run_gate == 'true'
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: needs.decision.outputs.run_gate == 'true'
        with:
          bun-version-file: .bun-version
      - name: Gate (typecheck, bundle and manifest freshness, package contents, tests)
        if: needs.decision.outputs.run_gate == 'true'
        env:
          # The expanded suite was still progressing at 600 s on hosted macOS (#378), and by 2026-10-19
          # its macOS test step ran 650-808 s, so 780 s failed runs that were still passing tests.
          # Linux also reached 600 s while conformance tests kept passing in both attempts of
          # run 39304959773 (#542). Give it 780 s; keep per-test bounds at 20 s.
          # By 2026-10-20 macOS jobs ran 892-1009 s and run 39419130424 was cut at 960 s twice while
          # still passing tests (#593): macOS gets 1260 s, and the job ceiling rose to 25 minutes with it.
          # Linux then hit 780 s one second after a passing test (run 39441258200): Linux gets 1080 s.
          # Run 40028391482 reached 1260 s on macOS while benchmark tests kept passing; allow 1440 s
          # and 30 minutes for that job, preserving Ubuntu's allowance and the per-test 20 s bound.
          # #516: a total-time kill cut suites that were still passing tests line by line (ubuntu runs 40264964185
          # and 40282389019 at 1080 s; PR #857's macOS leg at 1440 s). scripts/hang-watch.sh now stops the suite when
          # its progress file (one byte per test result line or file header) has not grown for AHUB_CHECK_QUIET_S (300 s), which is the hang detector;
          # AHUB_CHECK_HANG_S is only the backstop for a run that keeps printing results while hung, so it sits well above
          # a slow, healthy run: 1500 s on Linux and 1800 s on macOS, with the job limits raised to 35 and 40 minutes.
          AHUB_CHECK_HANG_S: ${{ runner.os == 'macOS' && '1800' || '1500' }}
          AHUB_CHECK_QUIET_S: '300'
          AHUB_RESTART_DIAGNOSTICS_DIR: ${{ runner.temp }}/ahub-restart-diagnostics
        run: scripts/check.sh
      - name: Capture macOS fsmonitor readback diagnostics after a failed gate
        if: failure() && needs.decision.outputs.run_gate == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          diagnostic_dir="$RUNNER_TEMP/ahub-docs-git-diagnostics"
          mkdir -p "$diagnostic_dir"
          git --version > "$diagnostic_dir/versions.txt"
          bun --version >> "$diagnostic_dir/versions.txt"
          node --version >> "$diagnostic_dir/versions.txt"
          for iteration in $(seq 1 20); do
            if GIT_TRACE2_EVENT="$diagnostic_dir/git-$iteration.jsonl" bun test --timeout 20000 test/check-docs.test.ts --test-name-pattern 'documentation readbacks never execute the repository fsmonitor helper' > "$diagnostic_dir/test-$iteration.log" 2>&1; then
              echo "fsmonitor diagnostic $iteration passed"
            else
              echo "fsmonitor diagnostic $iteration failed; preserving trace"
              break
            fi
          done
      - name: Retain macOS fsmonitor readback diagnostics
        if: failure() && needs.decision.outputs.run_gate == 'true' && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: docs-git-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/ahub-docs-git-diagnostics
          if-no-files-found: ignore
          retention-days: 1
      - name: Retain failed restart fixture diagnostics
        if: failure() && needs.decision.outputs.run_gate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: restart-diagnostics-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/ahub-restart-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  seeded-shard:
    # #457: the sequential seed pairs, split into four Linux shards that run beside check; each shard stays sequential.
    name: seeded guards (${{ matrix.shard }}/4)
    needs: decision
    if: needs.decision.outputs.run_gate == 'true'
    runs-on: ubuntu-latest
    # 419 guards take about 16 min in one job (about 2.3 s each): a quarter takes about 4 min.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Sequential green and seeded guard pairs
        env:
          SEED_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: bun scripts/seeded-check.ts --shard ${{ matrix.shard }}/4 --base "$SEED_BASE_REF"
      - name: Retain failed seeded-guard phase diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: seeded-diagnostics-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 5
          path: |
            /tmp/ahub-seed-*/green/test-output.txt
            /tmp/ahub-seed-*/seeded/test-output.txt
            /tmp/ahub-seed-*/green/leaks.txt
            /tmp/ahub-seed-*/seeded/leaks.txt

  seeded:
    # The required name: success means every shard passed or an identical-tree full proof was reused.
    name: seeded guards
    needs: [decision, seeded-shard]
    if: always() && needs.decision.result == 'success' && (needs.decision.outputs.admission == 'run' || needs.decision.outputs.admission == 'reuse')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reuse verified identical-tree full gate
        if: needs.decision.outputs.admission == 'reuse'
        env:
          VERIFIED_RUN: ${{ needs.decision.outputs.verified_run }}
        run: |
          test -n "$VERIFIED_RUN" || { echo "missing verified full-gate proof"; exit 1; }
          echo "Reused identical-tree full gate run $VERIFIED_RUN"
      - name: Every seeded shard passed
        if: needs.decision.outputs.run_gate == 'true'
        env:
          SHARDS: ${{ needs.seeded-shard.result }}
        run: |
          test "$SHARDS" = success || { echo "seeded shards: $SHARDS"; exit 1; }

  macos-timing:
    # Explicit #287 evidence only; never adds work to the ordinary PR/push path.
    if: github.event_name == 'workflow_dispatch' && inputs.timing_runs == '20'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Twenty consecutive affected-file runs (stop at first failure)
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "timing run $iteration/20 at $GITHUB_SHA"
            bun test --timeout 20000 test/daemon.test.ts test/pii-screen.test.ts test/acp.test.ts &
            test_pid=$!
            scripts/hang-watch.sh "$test_pid" 120 &
            watch_pid=$!
            result=0
            wait "$test_pid" || result=$?
            wait "$watch_pid"
            if [ "$result" -ne 0 ]; then exit "$result"; fi
          done
          echo "timing: 20/20 OK at $GITHUB_SHA"
