name: check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_bundle:
        description: Build committed plugin assets for review, without publishing
        type: boolean
        default: false
      timing_runs:
        description: Sequential macOS runs of daemon and PII screen tests only (0 disables)
        type: choice
        options: ['0', '20']
        default: '0'
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decision:
    if: github.event_name != 'workflow_dispatch' || (!inputs.prepare_bundle && inputs.timing_runs != '20')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_gate: ${{ steps.reuse.outputs.run_gate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/ci-reuse.mjs
          else
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          fi

  prepare-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_bundle && inputs.timing_runs != '20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-assets-${{ github.sha }}
          include-hidden-files: true
          path: |
            plugins/agent-hub/server.js
            plugins/agent-hub/.claude-plugin/plugin.json

  check:
    needs: decision
    if: needs.decision.outputs.run_gate == 'true'
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the seatbelt sandbox tests; Ubuntu proves the rest does not depend on macOS.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Gate (typecheck, bundle and manifest freshness, package contents, tests)
        run: scripts/check.sh

  seeded:
    name: seeded guards
    needs: [decision, check]
    if: needs.decision.outputs.run_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Six sequential green and seeded guard pairs
        run: bun scripts/seeded-check.ts

  macos-timing:
    # Explicit #287 evidence only; never adds work to the ordinary PR/push path.
    if: github.event_name == 'workflow_dispatch' && inputs.timing_runs == '20'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Twenty consecutive affected-file runs (stop at first failure)
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "timing run $iteration/20 at $GITHUB_SHA"
            bun test --timeout 20000 test/daemon.test.ts test/pii-screen.test.ts &
            test_pid=$!
            scripts/hang-watch.sh "$test_pid" 120 &
            watch_pid=$!
            result=0
            wait "$test_pid" || result=$?
            wait "$watch_pid"
            if [ "$result" -ne 0 ]; then exit "$result"; fi
          done
          echo "timing: 20/20 OK at $GITHUB_SHA"
